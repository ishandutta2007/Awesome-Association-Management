<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic / Animated Background Geometric Elements -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="160;190;160" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="220" fill="none" stroke="#c084fc" stroke-width="2">
      <animate attributeName="r" values="200;240;200" dur="10s" repeatCount="indefinite"/>
    </circle>
    <path d="M-50,200 Q300,100 600,220 T1250,150" fill="none" stroke="url(#textGrad)" stroke-width="3">
      <animate attributeName="d" values="M-50,200 Q300,100 600,220 T1250,150; M-50,180 Q300,240 600,160 T1250,200; M-50,200 Q300,100 600,220 T1250,150" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M-50,120 Q400,280 800,100 T1250,250" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8,8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating Particles in Background -->
  <g opacity="0.4">
    <circle cx="200" cy="220" r="4" fill="#38bdf8">
      <animate attributeName="cy" values="220;200;220" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="70" r="5" fill="#c084fc">
      <animate attributeName="cy" values="70;90;70" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="60" r="3" fill="#818cf8">
      <animate attributeName="cy" values="60;45;60" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content (Always on Top) -->
  <!-- Badge Pill -->
  <g transform="translate(450, 45)">
    <rect width="300" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="150" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.5">ORGANIZATION ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="140" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">
    Awesome Association Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0.2">
    Curated SaaS Platforms, Membership CRMs &amp; Open-Source Non-Profit Software
  </text>

  <!-- Tech Tag Pills -->
  <g transform="translate(600, 235)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text y="4" fill="#e2e8f0">Membership CRM</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <text y="4" fill="#e2e8f0">Dues &amp; Renewals</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(80, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
      <text y="4" fill="#e2e8f0">Event Management</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(240, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1" opacity="0.9"/>
      <text y="4" fill="#e2e8f0">Open Source AMS</text>
    </g>
  </g>
</svg>
